name: Regenerate GraphQL Types
run-name: Regenerate GraphQL types for schema version ${{ inputs.schema_version }}

on:
  workflow_dispatch:
    inputs:
      schema_version:
        description: 'Shopify API version (e.g., 2026-01)'
        required: true
        type: string

permissions: {}

jobs:
  generate-types:
    runs-on: ubuntu-latest
    environment: "Unit test environment"
    permissions:
      contents: read

    env:
      SCHEMA_VERSION: ${{ github.event.inputs.schema_version }}
      SCHEMA_JSON_FILE: "graphql-schemas/${{ github.event.inputs.schema_version }}.schema.json"
      SCHEMA_GRAPHQL_FILE: "graphql-schemas/${{ github.event.inputs.schema_version }}.schema.graphql"
      DEFAULT_SCHEMA_FILE: "graphql.schema.json"

    steps:
    - name: Generate app token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ vars.DIJON_BOT_APP_ID }}
        private-key: ${{ secrets.DIJON_BOT_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write

    - name: Checkout code
      # zizmor: ignore[artipacked] -- credentials intentionally persisted for `git push` in create-graphql-pr; no artifact uploads in this workflow.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ steps.app-token.outputs.token }}

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          10.0.x

    - name: Setup justfile
      uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
      with:
        tool: just@1.58.0

    - name: Configure git for Dijon Bot
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        DIJON_BOT_USER_ID: ${{ vars.DIJON_BOT_USER_ID }}
      run: |
        git config --local user.name "Dijon Bot"
        git config --local user.email "${DIJON_BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

    - name: Restore dependencies
      run: dotnet restore

    - name: Install sops
      uses: mdgreenwald/mozilla-sops-action@55177c1ff20a2b396280e4c5f53c32b69f0c1e40 # v2.1.1

    - name: Download GraphQL schema
      env:
        SOPS_AGE_KEY: "${{ secrets.SOPS_AGE_KEY }}"
      run: just download-graphql-schema --api-version "$SCHEMA_VERSION" --output "$SCHEMA_JSON_FILE" --use-sops-env-file

    - name: Convert JSON schema to GraphQL
      run: just convert-graphql-schema --input "$SCHEMA_JSON_FILE" --output "$SCHEMA_GRAPHQL_FILE"

    - name: Copy the GraphQL schema to the repo's default schema file
      run: cp "$SCHEMA_JSON_FILE" "$DEFAULT_SCHEMA_FILE"

    - name: Clean output directory
      run: just clean

    - name: Regenerate types from new schema
      run: just regenerate-and-build "$SCHEMA_GRAPHQL_FILE"

    - name: Create pull request
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: just create-graphql-pr --graph-schema-file "$SCHEMA_GRAPHQL_FILE" --json-schema-file "$SCHEMA_JSON_FILE"
