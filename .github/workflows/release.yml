name: Release Pipeline
run-name: Publish ${{ inputs.package_id }} ${{ inputs.package_version }}

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Package"
        type: choice
        default: 'ShopifySharp'
        options:
          - 'ShopifySharp'
          - 'ShopifySharp.Extensions.DependencyInjection'
      package_version:
        description: "New package version"
        type: string
        required: true

permissions: {}

env:
  ARTIFACTS_DIR: "./artifacts"

jobs:
  publish:
    name: "Publish release packages"
    runs-on: ubuntu-latest
    environment: "Release deployment environment"
    permissions:
      contents: write

    steps:
    - name: Setup justfile
      uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
      with:
        tool: just@1.46.0

    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          10.0.x

    - name: Install dotnet tools
      run: |
        dotnet tool install -g dotnet-setversion

    - name: Generate app token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ vars.DIJON_BOT_CLIENT_ID }}
        private-key: ${{ secrets.DIJON_BOT_PRIVATE_KEY }}
        permission-contents: write

    - name: Clone repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: false

    - name: Set package version
      env:
        PACKAGE_VERSION: ${{ inputs.package_version }}
        PACKAGE_ID: ${{ inputs.package_id }}
      run: just set-package-version "$PACKAGE_VERSION" "$PACKAGE_ID"

    - name: Build and pack
      run: just build-and-pack "${{ github.run_number }}" "${{ env.ARTIFACTS_DIR }}"

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: artifacts
        if-no-files-found: error
        path: |
          ${{ env.ARTIFACTS_DIR }}/ShopifySharp.${{ inputs.package_version }}.nupkg
          ${{ env.ARTIFACTS_DIR }}/ShopifySharp.${{ inputs.package_version }}.snupkg
          ${{ env.ARTIFACTS_DIR }}/ShopifySharp.Extensions.DependencyInjection.${{ inputs.package_version }}.nupkg
          ${{ env.ARTIFACTS_DIR }}/ShopifySharp.Extensions.DependencyInjection.${{ inputs.package_version }}.snupkg

    - name: Commit package version change
      uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
      with:
        add: ${{ inputs.package_id }}/${{ inputs.package_id }}.csproj
        commit: --signoff
        message: "Bump version to ${{ inputs.package_version }}"
        pathspec_error_handling: exitAtEnd
        default_author: github_actions
        author_name: 'Dijon Bot'
        author_email: '${{ vars.DIJON_BOT_USER_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
        push: true
        github_token: ${{ steps.app-token.outputs.token }}

    - name: Publish ${{ inputs.package_id }} package to Nuget
      run: just publish-to-nuget --full-release "${{ secrets.NUGET_TOKEN }}" "${{ env.ARTIFACTS_DIR }}"

    - name: Create GitHub release for ${{ inputs.package_id }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PACKAGE_ID: ${{ inputs.package_id }}
        PACKAGE_VERSION: ${{ inputs.package_version }}
      run: |
        gh release create "${PACKAGE_ID}/${PACKAGE_VERSION}" \
          --title "${PACKAGE_ID} ${PACKAGE_VERSION}" \
          --draft \
          "${ARTIFACTS_DIR}/${PACKAGE_ID}.${PACKAGE_VERSION}.nupkg" \
          "${ARTIFACTS_DIR}/${PACKAGE_ID}.${PACKAGE_VERSION}.snupkg"
