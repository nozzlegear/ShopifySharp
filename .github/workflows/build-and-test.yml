name: Build/Test Pipeline

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/wiki'
      - '.gitmodules'
      - '.github/**'
      - '.graphql-schemas/**'
      - 'graphql.config.yml'
      - 'graphql.schema.json'
      - 'graphql.schema.graphql'
      - 'readme.md'
      - 'attributions.md'
      - 'justfile'
      - 'env.encrypted.json'
      - '.sops.yaml'
  workflow_dispatch:

# Cancel any in-progress build/test runs
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  ARTIFACTS_DIR: "./artifacts"

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    environment: "Build Environment"
    permissions:
      contents: read

    steps:
    - name: Setup justfile
      uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
      with:
        tool: just@1.46.0

    - name: Checkout branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.ref }}
        persist-credentials: false

    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          10.0.x

    - name: Build and pack
      run: just build-and-pack "${{ github.run_number }}" "${{ env.ARTIFACTS_DIR }}"

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: artifacts
        if-no-files-found: error
        path: |
          ${{ env.ARTIFACTS_DIR }}/*.nupkg
          ${{ env.ARTIFACTS_DIR }}/*.snupkg

  test-windows:
    name: "Unit tests (.NET Framework)"
    runs-on: "windows-latest"
    needs: build
    environment: "Unit test environment"
    permissions:
      contents: read

    steps:
    - name: Setup justfile
      uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
      with:
        tool: just@1.46.0

    - name: Checkout branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install sops
      uses: mdgreenwald/mozilla-sops-action@55177c1ff20a2b396280e4c5f53c32b69f0c1e40 # v2.1.1

    - name: Execute .NET Framework unit tests
      env:
        SOPS_AGE_KEY: "${{ secrets.SOPS_AGE_KEY }}"
      run: just verbosity=quiet test-dnf --use-sops-env-file

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: framework-test-results
        path: TestResults
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

  test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    needs: build
    environment: "Unit test environment"
    permissions:
      contents: read

    steps:
    - name: Setup justfile
      uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
      with:
        tool: just@1.46.0

    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          10.0.x

    - name: Checkout branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install sops
      uses: mdgreenwald/mozilla-sops-action@55177c1ff20a2b396280e4c5f53c32b69f0c1e40 # v2.1.1

    - name: Execute unit test script
      env:
        SOPS_AGE_KEY: "${{ secrets.SOPS_AGE_KEY }}"
      run: just verbosity=quiet test-everything --use-sops-env-file

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: core-test-results
        path: TestResults
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

  publish:
    name: "Publish prerelease packages"
    runs-on: ubuntu-latest
    needs:
      - test-windows
      - test
    environment: "Prerelease deployment environment"
    permissions:
      contents: read
    # Only publish prerelease packages on the master branch
    if: ${{ github.ref_name == 'master' }}

    steps:
    - name: Setup justfile
      uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
      with:
        tool: just@1.46.0

    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          10.0.x

    - name: Checkout branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: artifacts
        path: ${{ env.ARTIFACTS_DIR }}

    - name: List files in artifacts folder
      run: ls "${{ env.ARTIFACTS_DIR }}"

    - name: Publish package to Nuget
      run: just publish-to-nuget --prerelease "${{ secrets.NUGET_TOKEN }}" "${{ env.ARTIFACTS_DIR }}"
